name: Retest exact coordinated Windows packages
on:
  push:
    branches: [codex/coordinated-app-integration]
    paths: [.github/workflows/coordinated-windows-acceptance.yml]
  workflow_dispatch:
    inputs:
      build_sha:
        description: 'Exact staged build SHA; no packages or feeds are published'
        type: string
        required: true
permissions:
  # GitHub hides unpublished draft downloads from read-only workflow tokens.
  # This job retrieves accepted files; it never publishes releases or feeds.
  contents: write
jobs:
  windows-acceptance:
    runs-on: windows-latest
    env:
      ACCEPTANCE_BUILD_SHA: ${{ inputs.build_sha || '3c674120de46c8cb1a5990c3730403a3f4e2283c' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Retrieve exact build and verify every package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:ACCEPTANCE_BUILD_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Use the exact staged build SHA' }
          New-Item -ItemType Directory -Force dist/update-release | Out-Null
          gh release download "coordinated-build-$env:ACCEPTANCE_BUILD_SHA" --repo $env:GITHUB_REPOSITORY --dir dist/update-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,hashlib;from pathlib import Path;p=Path('dist/update-release');v=json.loads((p/'backwoods-updates.json').read_text());assert v['sourceCommit']==__import__('os').environ['ACCEPTANCE_BUILD_SHA'];[(lambda f,a:(f.stat().st_size==a['size'] and hashlib.file_digest(f.open('rb'),'sha256').hexdigest()==a['sha256']) or __import__('sys').exit('Package failed verification'))(p/a['url'].rsplit('/',1)[1],a) for app in v['apps'].values() for a in [app['windows'],app['android']]]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix desktop --no-save --package-lock=false --ignore-scripts playwright@1.65.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install playwright==1.62.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare isolated acceptance fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .test-fixtures | Out-Null
          python -c "import sys,json;sys.path[:0]=['tests','scripts'];from test_employee_time import packet;from test_payroll_management import roster;from main_receipt_smoke import USER,DATA,PASSWORD;from pathlib import Path;p=Path('.test-fixtures');(p/'employee-time.json').write_text(json.dumps(packet()));(p/'payroll-roster.json').write_text(json.dumps(roster()));(p/'main-native.json').write_text(json.dumps({'user':USER,'data':DATA,'password':PASSWORD}))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and reinstall exact Main Vendor Accounting packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = @(
            @{ kind='main'; mask='Backwoods-Brew-Connected-Setup-*.exe'; path='Backwoods Brew Connected/Backwoods Brew Connected.exe' },
            @{ kind='vendor'; mask='Backwoods-Vendor-Ordering-Connected-Setup-*.exe'; path='Backwoods Vendor Ordering Connected/Backwoods Vendor Ordering Connected.exe' },
            @{ kind='accounting'; mask='Backwoods-Business-Accounting-Setup-*.exe'; path='Backwoods Business Accounting/Backwoods Business Accounting.exe' }
          )
          foreach ($item in $apps) {
            $installer = (Get-ChildItem dist/update-release -Filter $item.mask | Select-Object -First 1).FullName
            $executable = Join-Path "$env:LOCALAPPDATA/Programs" $item.path
            $profile = Join-Path $env:RUNNER_TEMP ('coordinated-' + $item.kind)
            foreach ($reuse in @($false,$true)) {
              $process = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw ('Install failed: ' + $item.kind) }
              $extra = @(); if ($reuse) { $extra = @('--reuse') }
              if ($item.kind -eq 'accounting') { node scripts/employee_time_installed.cjs "$executable" "$profile" @extra }
              else { node scripts/source_installed.cjs $item.kind "$executable" "$profile" @extra }
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
