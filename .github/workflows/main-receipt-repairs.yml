name: Main app receipt repair packages
on:
  workflow_dispatch:
  push:
    branches: [codex/main-receipt-repairs]
permissions:
  contents: read
jobs:
  main-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install pinned tools
        run: |
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          npm ci --prefix android-apps/main --no-audit --no-fund
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          node scripts/get_nsis.cjs
          python scripts/prepare_updaters.py
      - name: Test saved receipts and transaction behavior
        run: |
          node --test source-app-updates/main/tests/receipts.test.mjs
          node source-app-updates/main/scripts/verify.cjs
          python scripts/main_receipt_smoke.py
          node tests/source_updates.test.cjs
          node tests/firebase_feed.test.cjs
          node desktop/node_modules/electron/install.js
          desktop/node_modules/electron/dist/electron --no-sandbox --disable-dev-shm-usage --disable-gpu --ozone-platform=headless scripts/main_native_receipt_smoke.cjs
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Restore retained Main signing identity
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_UPDATE_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import os,base64
          from pathlib import Path
          value=os.environ.get('SIGNING_KEY','')
          if not value:raise SystemExit('Retained Android signing identity is required. No replacement signing key will be generated for the installed app.')
          path=Path('.build-resources/android-signing/debug.keystore')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(base64.b64decode(value,validate=True));path.chmod(0o600)
          PY
      - name: Build Main APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          (cd android-apps/main && node_modules/.bin/cap sync android)
          (cd android-apps/main/android && bash gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug)
      - name: Build Main Windows installer
        run: python scripts/build_source_installers.py main --builder "$PWD/desktop/node_modules/.bin/electron-builder" --nsis "$(cat .build-tools/nsis-path.txt)"
      - name: Prepare Main-only downloads
        run: |
          mkdir -p dist/main-receipt-repairs
          cp dist/source-app-updates/main/*Setup*.exe dist/main-receipt-repairs/
          cp android-apps/main/android/app/build/outputs/apk/debug/app-debug.apk dist/main-receipt-repairs/Backwoods-Brew-Connected-8.2.9.apk
          cp MAIN-RECEIPT-REPAIRS.md dist/main-receipt-repairs/
          sha256sum dist/main-receipt-repairs/*.exe dist/main-receipt-repairs/*.apk > dist/main-receipt-repairs/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Backwoods-Main-8.2.9-receipt-repairs
          path: dist/main-receipt-repairs/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Main-receipt-test-evidence
          path: test-results/main-receipts/
