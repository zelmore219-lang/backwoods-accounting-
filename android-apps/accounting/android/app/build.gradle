apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'
android {
    namespace 'com.backwoodsbrew.accounting'

    sourceSets {
        main {
            java.srcDir rootProject.file('../../shared-updater/src/main/java')
            res.srcDir rootProject.file('../../shared-updater/src/main/res')
        }
    }
    sourceSets.test.java.srcDir rootProject.file('../../shared-updater/src/test/java')
    signingConfigs {
        debug {
            storeFile rootProject.file('../../../.build-resources/android-signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileSdk 35
    testOptions { unitTests.includeAndroidResources = true }
    defaultConfig {
        applicationId 'com.backwoodsbrew.accounting'
        minSdk 24
        targetSdk 35
        versionCode 10007
        versionName '1.0.7'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets {
        main {
            python.srcDir rootProject.file('../../../.build-resources/android-python')
            assets.srcDir rootProject.file('../../../.build-resources/android-assets')
        }
    }
}
chaquopy {
    defaultConfig {
        version = '3.12'
        extractPackages 'accounting', 'certifi'
        pip { install 'certifi==2025.10.5' }
    }
}
dependencies {
    testImplementation 'org.robolectric:robolectric:4.16.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.25')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}
