name: Accept exact Vendor and Accounting connection packages
on:
  push:
    branches: [codex/production-suite-integration]
    paths: [.github/workflows/production-package-acceptance.yml]
  workflow_dispatch:
permissions:
  # GitHub draft release downloads require a push-capable repository token.
  contents: write
jobs:
  exact-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Retrieve accepted build bytes and verify unchanged app sources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = '7140d74d7c4715cbbf0d6ec92ccaf4f9a411ceb2'
          git fetch --no-tags --depth=1 origin $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code $source HEAD -- accounting web source-app-updates/vendor android-apps/vendor desktop
          if ($LASTEXITCODE -ne 0) { throw 'The retained Vendor/Accounting source changed; rebuild before retesting.' }
          New-Item -ItemType Directory -Force dist/update-release | Out-Null
          gh release download "coordinated-build-$source" --repo $env:GITHUB_REPOSITORY --dir dist/update-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,hashlib;from pathlib import Path;p=Path('dist/update-release');v=json.loads((p/'backwoods-updates.json').read_text());assert v['sourceCommit']=='7140d74d7c4715cbbf0d6ec92ccaf4f9a411ceb2';[(lambda f,a:(f.stat().st_size==a['size'] and hashlib.file_digest(f.open('rb'),'sha256').hexdigest()==a['sha256']) or __import__('sys').exit('Package failed verification'))(p/a['url'].rsplit('/',1)[1],a) for app in v['apps'].values() for a in [app['windows'],app['android']]]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix desktop --no-save --package-lock=false --ignore-scripts playwright@1.65.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare isolated Accounting fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .test-fixtures | Out-Null
          python -c "import sys,json;sys.path[:0]=['tests','scripts'];from test_employee_time import packet;from test_payroll_management import roster;from pathlib import Path;p=Path('.test-fixtures');(p/'employee-time.json').write_text(json.dumps(packet()));(p/'payroll-roster.json').write_text(json.dumps(roster()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, run and reinstall the exact Vendor and Accounting binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = @(
            @{ kind='vendor'; mask='Backwoods-Vendor-Ordering-Connected-Setup-*.exe'; path='Backwoods Vendor Ordering Connected/Backwoods Vendor Ordering Connected.exe' },
            @{ kind='accounting'; mask='Backwoods-Business-Accounting-Setup-*.exe'; path='Backwoods Business Accounting/Backwoods Business Accounting.exe' }
          )
          foreach ($item in $apps) {
            $installer = (Get-ChildItem dist/update-release -Filter $item.mask | Select-Object -First 1).FullName
            $executable = Join-Path "$env:LOCALAPPDATA/Programs" $item.path
            $profile = Join-Path $env:RUNNER_TEMP ('production-integration-' + $item.kind)
            foreach ($reuse in @($false,$true)) {
              $process = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw ('Install failed: ' + $item.kind) }
              $extra = @(); if ($reuse) { $extra = @('--reuse') }
              if ($item.kind -eq 'accounting') { node scripts/employee_time_installed.cjs "$executable" "$profile" @extra }
              else { node scripts/source_installed.cjs $item.kind "$executable" "$profile" @extra }
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          @{ packageSource='7140d74d7c4715cbbf0d6ec92ccaf4f9a411ceb2'; testSource=$env:GITHUB_SHA; vendorInstallReinstall=$true; accountingInstallReinstall=$true; preservedFixtureRecords=$true } | ConvertTo-Json | Set-Content dist/update-release/WINDOWS-CONNECTION-ACCEPTANCE.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Vendor-Accounting-Windows-acceptance
          path: dist/update-release/WINDOWS-CONNECTION-ACCEPTANCE.json
