<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backwoods Production</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#22352c;font:15px system-ui}aside{position:fixed;width:240px;background:#193d32;color:#e6ecdf;height:100vh;padding:32px 20px}h2{font:26px Georgia;margin:0}small{opacity:.65}nav{margin-top:40px}nav button{display:block;background:none;color:inherit;border:0;text-align:left;width:100%;padding:13px 14px;margin:3px 0;border-radius:6px;cursor:pointer}nav button.active{background:#36594a;color:#fff}main{margin-left:240px;padding:30px 42px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dbded6;padding-bottom:24px}h1{font:38px Georgia;margin:34px 0 8px}.muted{color:#778078}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:28px 0}.card,section{background:white;border:1px solid #dfe3d9;border-radius:9px;padding:24px}.card strong{display:block;font:32px Georgia;margin-top:18px}.bar{display:flex;justify-content:space-between;align-items:center;margin:30px 0 18px}button.primary{background:#264c39;color:white;border:0;padding:12px 20px;border-radius:5px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:17px 12px;border-bottom:1px solid #e6e9e1;font-size:13px}th{color:#778078;font-weight:500} .tag{background:#edf1e7;padding:5px 10px;border-radius:20px;font-size:12px}.empty{padding:55px;text-align:center;color:#778078}dialog{border:1px solid #d5dbd0;border-radius:12px;width:540px;max-width:95vw;padding:30px}dialog::backdrop{background:#152b2370}label{display:block;margin:13px 0;font-size:13px}input,select,textarea{display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #cad2c4;border-radius:4px;font:inherit}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}#error{color:#a33125}a{color:inherit}.notice{background:#e9e9dc;padding:13px 18px;border-radius:5px;font-size:13px;margin-top:22px}@media(max-width:850px){aside{position:static;width:auto;height:auto;padding:20px}nav{display:flex;overflow:auto;margin-top:15px}nav button{white-space:nowrap;width:auto}main{margin:0;padding:20px}.cards{grid-template-columns:repeat(2,1fr)}section{overflow:auto}h1{font-size:30px}}
</style><aside><h2>Backwoods</h2><small>PRODUCTION / OPERATIONS</small><nav id="nav"></nav><small>FROM RAW MATERIAL TO READY.</small></aside><main><header><span>Operations workspace</span><span class="tag">Local workspace</span></header><div id="view"></div></main><dialog id="modal"><form id="form"><h2 id="formtitle"></h2><div id="fields"></div><p id="error"></p><div class="actions"><button type="button" onclick="modal.close()">Cancel</button><button class="primary">Save record</button></div></form></dialog><script>
let state={records:[],events:[]},page='Overview',operation='',pending='';const pages=[
  'Overview',
  'Suppliers','Materials','Supplier pricing','Purchasing','Material lots','Invoices','Supplier returns',
  'Recipes','Production Schedule','Production','Quality & release','Finished inventory',
  'Reservations','Returns',
  'Stock adjustments','Waste','Sanitation','Traceability','Reports','Audit history',
  'Employees','Connections','Integration queue'
];const kinds={Suppliers:'suppliers',Materials:'materials',Purchasing:'purchases',Recipes:'recipes',Production:'batches','Quality & release':'batches'};const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rows=k=>state.records.filter(r=>r.kind===k);const name=id=>state.records.find(x=>x.id===id)?.name||id;const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
async function load(){let r=await fetch('/api/state');state=await r.json();render()}function go(p){page=p;render()}function render(){nav.innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('');let batches=rows('batches'),materials=rows('materials');let title=page==='Overview'?'A clear view of your production.':page;view.innerHTML=`<h1>${title}</h1><p class="muted">${page==='Overview'?'Track the inputs. Know the cost. Release with confidence.':'Backwoods Production · Operations workspace'}</p>`;
if(page==='Overview'){view.innerHTML+=`<div class="cards">${[...(signedInRole==='manager'?[['Material value',money(sum(materials,x=>+x.quantity*+x.cost))]]:[]),['Production batches',batches.length],['Awaiting inspection',batches.filter(x=>x.status==='Awaiting inspection').length],['Released packages',sum(batches.filter(x=>x.status==='Released for sale'),x=>+x.packages)]].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="bar"><h2>Production floor</h2><button class="primary" onclick="go('Production');openForm('batches')">+ Record batch</button></div>`;table(batches,['Batch / lot','Product','Usable yield',...(signedInRole==='manager'?['Actual cost']:[]),'Status'],x=>[x.lot,x.name,x.output+' lb',...(signedInRole==='manager'?[money(x.total)]:[]),x.status]);view.innerHTML+='<div class="notice">Start with suppliers and materials, receive a purchase, then create a recipe and record a batch. Quantities use pounds; costs use USD.</div>';return}
if(page==='Connections'){view.innerHTML+='<section><h2>Ready for the next build</h2><p>Wholesale Vendor Ordering · Not connected</p><p>Central Accounting · Not connected</p><p>Backwoods Employees · Not connected</p><p class="muted">Released batches are recorded locally. No external inventory, sales, payroll, or accounting records are created.</p></section>';return}
if(page==='Reports'){view.innerHTML+='<div class="bar"><h2>Batch costing</h2><button class="primary" onclick="download()">Export CSV</button><button onclick="print()">Print / PDF</button></div>';table(batches,['Lot','Total cost','Cost / lb','Cost / package','Loss'],x=>[x.lot,money(x.total),money(x.per_lb),money(x.unit),Number(x.loss).toFixed(1)+'%']);return}
let kind=kinds[page];view.innerHTML+=`<div class="bar"><h2>${page==='Quality & release'?'Inspection queue':'All records'}</h2>${page==='Quality & release'?'':`<button class="primary" onclick="openForm('${kind}')">+ ${page==='Production'?'Record batch':'Add record'}</button>`}</div>`;const config={suppliers:[['Supplier','Contact','Terms'],x=>[x.name,x.contact,x.terms]],materials:[['Material','On hand',...(signedInRole==='manager'?['Landed cost / stock unit']:[]),'Reorder point'],x=>[x.name,x.quantity,...(signedInRole==='manager'?[money(x.cost)]:[]),x.reorder]],purchases:[['Purchase','Material','Ordered (lb)','Received (lb)','Action'],x=>[x.name,name(x.material),x.quantity,x.received||0,`<button onclick="receive('${x.id}')">Receive</button>`]],recipes:[['Recipe','Version','Material','Instructions'],x=>[x.name,x.version,name(x.material),x.instructions]],batches:[['Lot','Product',...(signedInRole==='manager'?['Cost / package']:[]),'Status','Action'],x=>[x.lot,x.name,...(signedInRole==='manager'?[money(x.unit)]:[]),x.status,`<button onclick="quality('${x.id}')">Inspect / release</button>`]]};table(rows(kind),...config[kind])}
function table(data,headers,mapper){view.insertAdjacentHTML('beforeend',`<section>${data.length?`<table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${data.map(x=>`<tr>${mapper(x).map(v=>`<td>${safeCell(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">No records yet. Add your first record to get started.</div>'}</section>`)}
const field=(key,label,type='text',options=null)=>`<label>${label}${options?`<select name="${key}" required>${options.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" ${type==='number'?'min="0" step="any"':''} required>`}</label>`;
function openForm(kind,extra=''){operation=kind;pending=crypto.randomUUID();formtitle.textContent={suppliers:'Add supplier',materials:'Add material',purchases:'Create purchase order',recipes:'Create recipe version',batches:'Record completed batch',receive:'Receive goods',quality:'Quality inspection'}[kind];error.textContent='';let f=field;fields.innerHTML=extra||({suppliers:()=>f('name','Company name')+f('contact','Contact information')+f('terms','Payment terms'),materials:()=>f('name','Material name')+f('quantity','Opening stock (lb)','number')+f('cost','Actual landed cost per lb ($)','number')+f('reorder','Reorder point (lb)','number'),purchases:()=>f('name','Purchase order number')+f('supplier','Supplier','text',rows('suppliers'))+f('material','Material','text',rows('materials'))+f('quantity','Quantity ordered (lb)','number')+f('cost','Purchase cost per lb ($)','number')+f('freight','Total freight ($)','number'),recipes:()=>f('name','Product name')+f('version','Recipe version')+f('material','Primary raw material','text',rows('materials'))+f('instructions','Production instructions'),batches:()=>f('name','Product / batch name')+f('recipe','Recipe version','text',rows('recipes'))+f('lot','Source and finished lot reference')+['input','output','packages','seasoning','packaging','labor','energy','overhead'].map((k,i)=>f(k,['Input weight (lb)','Usable output (lb)','Finished package count','Seasoning cost ($)','Packaging cost ($)','Direct labor ($)','Energy ($)','Manufacturing overhead ($)'][i],'number')).join('')})[kind]?.();modal.showModal()}
function receive(id){openForm('receive',`<input type="hidden" name="id" value="${id}">`+field('quantity','Actual received weight (lb)','number')+field('lot','Supplier lot / internal lot'))}function quality(id){let b=state.records.find(x=>x.id===id),opts=({'Awaiting inspection':['Approved','Quarantined','Rejected'],Approved:['Released for sale','Quarantined'],Quarantined:['Approved','Rejected']})[b.status]||[];if(!opts.length)return alert('This status is final in this version.');openForm('quality',`<input type="hidden" name="id" value="${id}">`+field('status','Decision','text',opts.map(x=>({id:x,name:x})))+field('notes','Inspection findings and release notes'))}
form.onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(form));data.event_id=pending;try{let r=await fetch('/api/'+operation,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),result=await r.json();if(!r.ok)throw Error(result.error);modal.close();await load()}catch(e){error.textContent=e.message}};function download(){let data=[['Lot','Product','Total','Cost per lb','Cost per package'],...rows('batches').map(x=>[x.lot,x.name,x.total,x.per_lb,x.unit])];let blob=new Blob([data.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backwoods-costing.csv';a.click();URL.revokeObjectURL(a.href)}
</script><script src="/app.js"></script></html>
