name: Verify retained Production Windows update
on:
  push:
    branches: [codex/production-suite-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build the connected application update
        run: python scripts/build_production_update.py
      - name: Verify original desktop, application update, cryptography and retained data
        shell: pwsh
        run: ./scripts/production_native_acceptance.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Production-Windows-connection-update
          path: |
            dist/production/*
            ${{ runner.temp }}/production-connection-native/Application/verification-error.txt
          retention-days: 14
