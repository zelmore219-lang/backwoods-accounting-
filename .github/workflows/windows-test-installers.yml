name: Build and publish Windows test installers

on:
  workflow_dispatch:
    inputs:
      employee_time_only:
        description: Verify only the Accounting approved-Employee-time update
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/workflows/windows-test-installers.yml]

permissions:
  contents: write

jobs:
  installers:
    if: github.event_name != 'workflow_dispatch' || !inputs.employee_time_only
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned tools and portable Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check uv==0.13.4
          if ($LASTEXITCODE -ne 0) { throw 'uv installation failed' }
          python -m uv python install --install-dir .build-resources/managed-python --no-bin --no-registry cpython-3.12.15-windows-x86_64-none
          if ($LASTEXITCODE -ne 0) { throw 'Portable Python download failed' }
          New-Item -ItemType Directory -Force .build-resources/python | Out-Null
          Copy-Item '.build-resources/managed-python/cpython-3.12.15-windows-x86_64-none/*' .build-resources/python -Recurse -Force
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed' }
      - name: Verify accounting and source connectors
        shell: pwsh
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Accounting tests failed' }
          node tests/source_updates.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Source update tests failed' }
          node tests/firebase_feed.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Firebase transfer tests failed' }
      - name: Verify real retail and vendor login screens
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependencies failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
          python scripts/source_browser_smoke.py --apk-dir android-apks
          if ($LASTEXITCODE -ne 0) { throw 'Real source-app login checks failed' }
      - name: Validate merged permissions with the Firestore emulator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Show-CheckFailure($file) {
            Get-Content $file -Tail 35 | ForEach-Object {
              $line = $_.ToString().Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error::$line"
            }
            exit 1
          }
          npm ci --prefix tests/firebase-rules --no-audit --no-fund 2>&1 | Tee-Object rule-dependencies.log
          if ($LASTEXITCODE -ne 0) { Show-CheckFailure rule-dependencies.log }
          & tests/firebase-rules/node_modules/.bin/firebase.cmd emulators:exec --only firestore --project demo-backwoods-accounting --config firebase.emulator.json 'node tests/firebase-rules/rules.test.cjs' 2>&1 | Tee-Object rule-check.log
          if ($LASTEXITCODE -ne 0) { Show-CheckFailure rule-check.log }
      - name: Build all three Windows installers
        shell: pwsh
        run: |
          & desktop/node_modules/.bin/electron-builder.cmd --projectDir source-app-updates/main --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Main installer failed' }
          & desktop/node_modules/.bin/electron-builder.cmd --projectDir source-app-updates/vendor --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Vendor installer failed' }
          & desktop/node_modules/.bin/electron-builder.cmd --config desktop/electron-builder.yml --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Accounting installer failed' }
      - name: Prepare checked download assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/test-release | Out-Null
          Copy-Item android-apks/*.apk dist/test-release
          Copy-Item dist/source-app-updates/main/*Setup*.exe dist/test-release
          Copy-Item dist/source-app-updates/vendor/*Setup*.exe dist/test-release
          Copy-Item dist/windows/*Setup*.exe dist/test-release
          Copy-Item firebase/firestore.rules dist/test-release/Firebase-Firestore-Merged.rules
          Copy-Item firebase/SETUP.md dist/test-release/Firebase-Accounting-Setup.md
          $artifacts = @(Get-ChildItem dist/test-release -File | ForEach-Object {
            @{ file=$_.Name; bytes=$_.Length; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          $artifacts | ForEach-Object { "$($_.sha256)  $($_.file)" } | Set-Content dist/test-release/SHA256SUMS.txt
          @{ sourceCommit=$env:GITHUB_SHA; sourceLoginBrowserTested=$true; liveFirebaseTested=$false; physicalDeviceTested=$false; artifacts=$artifacts } | ConvertTo-Json -Depth 5 | Set-Content dist/test-release/BUILD-MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: all-three-app-test-downloads
          path: dist/test-release/*
          retention-days: 7
      - name: Publish review downloads to GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'firebase-spark-test-2'
          $assets = @(Get-ChildItem dist/test-release -File | ForEach-Object { $_.FullName })
          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
            gh release edit $tag --draft=false --prerelease --notes-file firebase/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --prerelease --title 'Backwoods Firebase Spark - all three apps' --notes-file firebase/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }

  employee-time:
    if: github.event_name == 'workflow_dispatch' && inputs.employee_time_only
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned package tools and retained Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install uv==0.13.4 Pillow==13.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m uv python install --install-dir .build-resources/managed-python --no-bin --no-registry cpython-3.12.15-windows-x86_64-none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .build-resources/python | Out-Null
          Copy-Item '.build-resources/managed-python/cpython-3.12.15-windows-x86_64-none/*' .build-resources/python -Recurse -Force
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix desktop --no-save --package-lock=false --ignore-scripts playwright@1.65.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Accounting and approved Employee import contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/updater.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/firebase_feed.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_updaters.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .test-fixtures | Out-Null
          python -c "import json,sys;sys.path.insert(0,'tests');from test_employee_time import packet;from pathlib import Path;Path('.test-fixtures/employee-time.json').write_text(json.dumps(packet()))"
      - name: Build Accounting only
        run: desktop/node_modules/.bin/electron-builder.cmd --config desktop/electron-builder.yml --win nsis --x64 --publish never
      - name: Install and exercise actual packaged UI
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/windows -Filter '*Setup*.exe' | Select-Object -First 1).FullName
          $process = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Accounting installation failed' }
          $app = Join-Path $env:LOCALAPPDATA 'Programs/Backwoods Business Accounting/Backwoods Business Accounting.exe'
          node scripts/employee_time_installed.cjs "$app" "$env:RUNNER_TEMP/employee-time-profile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Accounting reinstallation failed' }
          node scripts/employee_time_installed.cjs "$app" "$env:RUNNER_TEMP/employee-time-profile" --reuse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = Split-Path $installer -Leaf
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content dist/windows/SHA256SUMS.txt -Encoding ascii
          Copy-Item "$env:RUNNER_TEMP/employee-time-profile/*result.json" dist/windows
      - name: Stage verified installer privately
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stage-ci-release.py --prefix accounting-time-ci 'dist/windows/*Setup*.exe' dist/windows/SHA256SUMS.txt 'dist/windows/*result.json'
