name: App updates (Windows and Android)
on:
  workflow_dispatch:
    inputs:
      accounting_device_check:
        description: 'Test Accounting upgrades and the release APK on Android 17 without publishing'
        default: false
        type: boolean
      release_tag:
        description: 'New package release tag (leave blank for apps-RUN_NUMBER)'
        required: false
        type: string
      accounting_version:
        description: 'Accounting version (e.g. 1.0.5; blank uses repository version)'
        required: false
        type: string
      vendor_version:
        description: 'Vendor version (e.g. 4.1.7; blank uses repository version)'
        required: false
        type: string
      main_version:
        description: 'Main version (e.g. 8.2.6; blank uses repository version)'
        required: false
        type: string
      reuse_accounting:
        description: 'Keep the exact published Accounting packages when only Main/Vendor change'
        default: false
        type: boolean
      publish:
        description: 'Publish packages and activate the update feed after validation'
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: backwoods-app-updates
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !inputs.accounting_device_check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.release_tag || format('apps-{0}', github.run_number) }}
      ACCOUNTING_VERSION: ${{ inputs.accounting_version }}
      VENDOR_VERSION: ${{ inputs.vendor_version }}
      MAIN_VERSION: ${{ inputs.main_version }}
      REUSE_ACCOUNTING: ${{ inputs.reuse_accounting }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore retained Android signing identity
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_UPDATE_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import os,base64
          from pathlib import Path
          value=os.environ.get('ANDROID_SIGNING_KEY','')
          if not value:raise SystemExit('Add the ANDROID_UPDATE_KEYSTORE_BASE64 repository secret before building. Never generate a replacement key for an existing app.')
          folder=Path('.build-resources/android-signing');folder.mkdir(parents=True,exist_ok=True)
          key=folder/'debug.keystore';key.write_bytes(base64.b64decode(value,validate=True));key.chmod(0o600)
          PY
      - name: Set selected versions and install pinned build tools
        run: |
          python scripts/set_app_versions.py --accounting "$ACCOUNTING_VERSION" --vendor "$VENDOR_VERSION" --main "$MAIN_VERSION"
          python -m pip install --disable-pip-version-check uv==0.13.4 Pillow==13.0.0 playwright==1.62.0
          uv python install --install-dir .build-resources/managed-python --no-bin --no-registry cpython-3.12.15-windows-x86_64-none
          python - <<'PY'
          import shutil
          shutil.copytree('.build-resources/managed-python/cpython-3.12.15-windows-x86_64-none','.build-resources/python',symlinks=True)
          PY
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          npm ci --prefix android-apps/main --no-audit --no-fund
          npm ci --prefix android-apps/vendor --no-audit --no-fund
          node scripts/get_nsis.cjs
          python scripts/prepare_updaters.py
          python scripts/prepare_app_icons.py
          python scripts/prepare_accounting_android.py
      - name: Test accounting and updater rules
        run: |
          python -m unittest discover -s tests -q
          node tests/updater.test.cjs
          node tests/updater-electron.test.cjs
          node tests/updater-transport.test.cjs
          node tests/source_updates.test.cjs
          node tests/firebase_feed.test.cjs
          python -m playwright install --with-deps chromium
          python scripts/browser_updater_smoke.py
          python scripts/browser_settings_updates_smoke.py
          node desktop/node_modules/electron/install.js
          desktop/node_modules/electron/dist/electron --no-sandbox --ozone-platform=headless scripts/electron_live_updater.cjs --download
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android SDK and native assets
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          (cd android-apps/main && node_modules/.bin/cap sync android)
          (cd android-apps/vendor && node_modules/.bin/cap sync android)
      - name: Build Android APKs and native updater tests
        run: |
          (cd android-apps/accounting/android && bash gradlew --no-daemon --max-workers=2 testReleaseUnitTest assembleRelease)
          (cd android-apps/main/android && bash gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug)
          (cd android-apps/vendor/android && bash gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug)
      - name: Build Windows installers
        run: |
          NSIS_COMPILER="$(cat .build-tools/nsis-path.txt)"
          python scripts/build_installer.py --nsis "$NSIS_COMPILER"
          python scripts/build_source_installers.py main --builder "$PWD/desktop/node_modules/.bin/electron-builder" --nsis "$NSIS_COMPILER"
          python scripts/build_source_installers.py vendor --builder "$PWD/desktop/node_modules/.bin/electron-builder" --nsis "$NSIS_COMPILER"
      - name: Validate identities and prepare update feed
        run: |
          if [ "$REUSE_ACCOUNTING" = "true" ]; then
            python scripts/build_update_release.py --tag "$RELEASE_TAG" --reuse-accounting
          else
            python scripts/build_update_release.py --tag "$RELEASE_TAG"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-and-android-updates
          path: dist/update-release/*
          retention-days: 14
      - name: Publish verified packages and update feed
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_updates.py --tag "$RELEASE_TAG" --directory dist/update-release
  accounting-device-check:
    if: ${{ inputs.accounting_device_check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, google_apis_ps16k]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Build retained-key release candidate
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_UPDATE_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import os,base64
          from pathlib import Path
          folder=Path('.build-resources/android-signing');folder.mkdir(parents=True,exist_ok=True)
          key=folder/'debug.keystore';key.write_bytes(base64.b64decode(os.environ['ANDROID_SIGNING_KEY'],validate=True));key.chmod(0o600)
          PY
          python -m pip install Pillow==13.0.0
          python scripts/prepare_accounting_android.py
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          (cd android-apps/accounting/android && bash gradlew --no-daemon --max-workers=2 testReleaseUnitTest assembleRelease)
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          script: python scripts/accounting_device_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounting-android17-${{ matrix.target }}
          path: |
            android-apps/accounting/android/app/build/outputs/apk/release/*.apk
            dist/accounting-device-check/*
          retention-days: 14
